<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Self Weld Industries</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../auth.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-wrapper">
      <div class="auth-header">
        <a href="../index.html" class="logo-link">Self Weld Industries</a>
        <p class="subtitle">Power Tools & Welding Solutions</p>
      </div>

      <form class="auth-form" id="loginForm">
        <h1>Admin Login</h1>
        <p class="form-desc">Enter your credentials to access the admin dashboard</p>

        <div class="form-group">
          <label for="email">Email or Phone Number</label>
          <input
            type="text"
            id="email"
            name="email"
            placeholder="admin@selfweldindustries.com or 91XXXXXXXXXX"
            required
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              required
              autocomplete="current-password"
            />
            <button type="button" class="toggle-pwd" id="togglePwd" aria-label="Toggle password visibility">👁️</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-full">
          <span>Login</span>
          <span class="spinner" id="spinner" style="display: none;">⏳</span>
        </button>

        <div class="alert alert-error" id="errorMsg" style="display: none;"></div>
      </form>

      <div class="auth-footer">
        <a href="forgot-password.html" class="link-secondary">Forgot password?</a>
        <p class="text-muted">Self Weld Admin System</p>
      </div>
    </div>
  </div>

  <script src="../auth.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const togglePwd = document.getElementById('togglePwd');
    const pwdInput = document.getElementById('password');
    const spinner = document.getElementById('spinner');

    togglePwd.addEventListener('click', (e) => {
      e.preventDefault();
      const isPassword = pwdInput.type === 'password';
      pwdInput.type = isPassword ? 'text' : 'password';
      togglePwd.textContent = isPassword ? '👁️‍🗨️' : '👁️';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';
      spinner.style.display = 'inline';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showError('Please fill all fields');
        spinner.style.display = 'none';
        return;
      }

      try {
        // Mock authentication - replace with real API call
        if (email === 'admin@selfweldindustries.com' && password === 'Admin@123456') {
          // Store auth token
          localStorage.setItem('adminToken', 'mock-jwt-token-' + Date.now());
          localStorage.setItem('adminUser', JSON.stringify({
            name: 'Admin User',
            email: email,
            role: 'Administrator'
          }));
          
          // Small delay for visual feedback
          setTimeout(() => {
            window.location.href = './dashboard.html';
          }, 500);
        } else {
          showError('Invalid credentials. Use admin@selfweldindustries.com / Admin@123456');
        }
        
        spinner.style.display = 'none';
      } catch (err) {
        spinner.style.display = 'none';
        showError('Connection error. Please try again.');
      }
    });

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = 'block';
    }
  </script>
</body>
</html>
