<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | AUM Enterprise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../auth.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-wrapper">
      <div class="auth-header">
        <img src="../img/logo-mark.png" alt="AUM Enterprise Logo" style="width: 80px; height: auto; margin: 0 auto 1rem; display: block;">
        <a href="../index.html" class="logo-link">AUM Enterprise</a>
        <p class="subtitle">Account Recovery</p>
      </div>

      <div class="step-indicator">
        <span class="step active">1</span>
        <span class="step-line"></span>
        <span class="step">2</span>
        <span class="step-line"></span>
        <span class="step">3</span>
      </div>

      <form class="auth-form" id="forgotForm">
        <h1>Forgot Password?</h1>
        <p class="form-desc">No worries! Enter your registered phone number and we'll send you a verification code.</p>

        <div class="form-group">
          <label for="phone"><i class="fas fa-phone"></i> Phone Number</label>
          <input type="tel" id="phone" placeholder="e.g. 8275613310" required pattern="[0-9]{10,12}">
          <small class="hint">Enter your registered phone number (10 digits)</small>
        </div>

        <button type="submit" class="btn btn-primary btn-full" id="submitBtn">
          <span>Send Verification Code</span>
          <span class="spinner" id="spinner" style="display:none"><i class="fas fa-circle-notch fa-spin"></i></span>
        </button>

        <div class="alert alert-error" id="errorMsg" style="display:none"></div>
        <div class="alert alert-success" id="successMsg" style="display:none"><i class="fas fa-check-circle"></i> OTP sent to your phone!</div>
      </form>

      <div class="auth-footer">
        <a href="login.html" class="link-secondary"><i class="fas fa-arrow-left"></i> Back to Sign In</a>
        <p class="text-muted">Secure password reset via OTP</p>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('forgotForm');
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    const spinner = document.getElementById('spinner');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';
      successMsg.style.display = 'none';
      spinner.style.display = 'inline';
      submitBtn.disabled = true;

      const phone = document.getElementById('phone').value.trim();
      if (!phone || phone.length < 10) { showError('Please enter a valid phone number'); return; }

      try {
        const res = await fetch('/api/auth/forgot-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phone }) });
        const data = await res.json();
        spinner.style.display = 'none';
        submitBtn.disabled = false;

        if (!res.ok) { showError(data.message || 'Phone number not found'); return; }

        successMsg.style.display = 'flex';
        sessionStorage.setItem('resetPhone', phone);
        setTimeout(() => { window.location.href = 'verify-otp.html'; }, 1500);
      } catch (err) { showError('Unable to connect. Please try again.'); }
    });

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = 'block';
      spinner.style.display = 'none';
      submitBtn.disabled = false;
    }
  </script>
</body>
</html>
