<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Self Weld Industries</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../auth.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-wrapper">
      <div class="auth-header">
        <a href="../index.html" class="logo-link">Self Weld Industries</a>
        <p class="subtitle">Account Recovery</p>
      </div>

      <form class="auth-form" id="forgotForm">
        <h1>Forgot Password</h1>
        <p class="form-desc">Enter your registered phone number to reset your password</p>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="91XXXXXXXXXX"
            required
            pattern="[0-9]{12}"
          />
          <small class="hint">Enter 12-digit phone number (country code + number)</small>
        </div>

        <button type="submit" class="btn btn-primary btn-full">
          <span>Send OTP</span>
          <span class="spinner" id="spinner" style="display: none;">⏳</span>
        </button>

        <div class="alert alert-error" id="errorMsg" style="display: none;"></div>
        <div class="alert alert-success" id="successMsg" style="display: none;">OTP sent to your phone</div>
      </form>

      <div class="auth-footer">
        <a href="login.html" class="link-secondary">← Back to Login</a>
        <p class="text-muted">Secure password reset via OTP</p>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('forgotForm');
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    const spinner = document.getElementById('spinner');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';
      successMsg.style.display = 'none';
      spinner.style.display = 'inline';

      const phone = document.getElementById('phone').value.trim();

      if (!phone || phone.length !== 12) {
        showError('Please enter a valid 12-digit phone number');
        spinner.style.display = 'none';
        return;
      }

      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone })
        });

        spinner.style.display = 'none';
        const data = await res.json();

        if (!res.ok) {
          showError(data.message || 'Phone number not found');
          return;
        }

        successMsg.style.display = 'block';
        sessionStorage.setItem('resetPhone', phone);
        setTimeout(() => {
          window.location.href = `verify-otp.html?phone=${encodeURIComponent(phone)}`;
        }, 2000);
      } catch (err) {
        spinner.style.display = 'none';
        showError('Connection error. Please try again.');
      }
    });

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = 'block';
    }
  </script>
</body>
</html>
