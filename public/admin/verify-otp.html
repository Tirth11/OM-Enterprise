<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify OTP | AUM Enterprise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../auth.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-wrapper">
      <div class="auth-header">
        <img src="../img/logo-mark.png" alt="AUM Enterprise Logo" style="width: 80px; height: auto; margin: 0 auto 1rem; display: block;">
        <a href="../index.html" class="logo-link">AUM Enterprise</a>
        <p class="subtitle">Verify Your Identity</p>
      </div>

      <div class="step-indicator">
        <span class="step done"><i class="fas fa-check" style="font-size:0.65rem"></i></span>
        <span class="step-line active"></span>
        <span class="step active">2</span>
        <span class="step-line"></span>
        <span class="step">3</span>
      </div>

      <form class="auth-form" id="otpForm">
        <h1>Enter Verification Code</h1>
        <p class="form-desc">We've sent a 6-digit code to your registered phone number. Enter it below to continue.</p>

        <div class="form-group">
          <label for="otp"><i class="fas fa-shield-alt"></i> OTP Code</label>
          <input type="text" id="otp" placeholder="● ● ● ● ● ●" required maxlength="6" pattern="[0-9]{6}" inputmode="numeric" style="text-align:center;font-size:1.4rem;letter-spacing:0.6rem;font-weight:700">
        </div>

        <button type="submit" class="btn btn-primary btn-full" id="verifyBtn">
          <span>Verify Code</span>
          <span class="spinner" id="spinner" style="display:none"><i class="fas fa-circle-notch fa-spin"></i></span>
        </button>

        <div class="alert alert-error" id="errorMsg" style="display:none"></div>

        <div class="otp-info">
          <p style="font-size:0.82rem;color:var(--text-muted);margin-bottom:0.4rem">Didn't receive the code?</p>
          <button type="button" class="link-secondary" id="resendBtn" style="border:none;background:none;cursor:pointer;font-size:0.85rem;padding:0"><i class="fas fa-redo"></i> Resend Code</button>
        </div>
      </form>

      <div class="auth-footer">
        <a href="forgot-password.html" class="link-secondary"><i class="fas fa-arrow-left"></i> Change Phone Number</a>
      </div>
    </div>
  </div>

  <script>
    const phone = new URLSearchParams(window.location.search).get('phone') || sessionStorage.getItem('resetPhone');
    if (!phone) window.location.href = 'forgot-password.html';

    const form = document.getElementById('otpForm');
    const errorMsg = document.getElementById('errorMsg');
    const spinner = document.getElementById('spinner');
    const verifyBtn = document.getElementById('verifyBtn');
    const resendBtn = document.getElementById('resendBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';
      spinner.style.display = 'inline';
      verifyBtn.disabled = true;

      const otp = document.getElementById('otp').value.trim();
      if (!otp || otp.length !== 6) { showError('Please enter the complete 6-digit code'); return; }

      try {
        const res = await fetch('/api/auth/verify-otp', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phone, otp }) });
        const data = await res.json();

        if (!res.ok) { showError(data.message || 'Invalid code. Please check and try again.'); return; }

        sessionStorage.setItem('resetToken', data.token);
        window.location.href = 'reset-password.html';
      } catch (err) { showError('Unable to connect. Please try again.'); }
    });

    resendBtn.addEventListener('click', async () => {
      resendBtn.disabled = true;
      resendBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Sending...';
      try {
        await fetch('/api/auth/resend-otp', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phone }) });
        resendBtn.innerHTML = '<i class="fas fa-check"></i> Code Sent!';
        setTimeout(() => { resendBtn.innerHTML = '<i class="fas fa-redo"></i> Resend Code'; resendBtn.disabled = false; }, 30000);
      } catch(e) {
        resendBtn.innerHTML = '<i class="fas fa-redo"></i> Resend Code';
        resendBtn.disabled = false;
        showError('Failed to resend. Please try again.');
      }
    });

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = 'block';
      spinner.style.display = 'none';
      verifyBtn.disabled = false;
    }
  </script>
</body>
</html>
