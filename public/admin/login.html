<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | AUM Enterprise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../auth.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-wrapper">
      <div class="auth-header">
        <a href="../index.html" class="logo-link"><i class="fas fa-tools"></i> AUM Enterprise</a>
        <p class="subtitle">Power Tools & Welding Solutions</p>
      </div>

      <form class="auth-form" id="loginForm">
        <h1>Welcome Back</h1>
        <p class="form-desc">Sign in to access your admin dashboard</p>

        <div class="form-group">
          <label for="email"><i class="fas fa-user"></i> Email or Phone</label>
          <input type="text" id="email" placeholder="Enter your email or phone number" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password"><i class="fas fa-lock"></i> Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
            <button type="button" class="toggle-pwd" id="togglePwd" aria-label="Toggle password visibility"><i class="fas fa-eye"></i></button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-full" id="loginBtn">
          <span>Sign In</span>
          <span class="spinner" id="spinner" style="display:none"><i class="fas fa-circle-notch fa-spin"></i></span>
        </button>

        <div class="alert alert-error" id="errorMsg" style="display:none"></div>
      </form>

      <div class="auth-footer">
        <a href="forgot-password.html" class="link-secondary">Forgot your password? <i class="fas fa-arrow-right"></i></a>
        <p class="text-muted">&copy; 2024 AUM Enterprise &bull; Admin Panel</p>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const spinner = document.getElementById('spinner');
    const loginBtn = document.getElementById('loginBtn');
    const togglePwd = document.getElementById('togglePwd');
    const pwdInput = document.getElementById('password');

    togglePwd.addEventListener('click', () => {
      const show = pwdInput.type === 'password';
      pwdInput.type = show ? 'text' : 'password';
      togglePwd.innerHTML = show ? '<i class="fas fa-eye-slash"></i>' : '<i class="fas fa-eye"></i>';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';
      spinner.style.display = 'inline';
      loginBtn.disabled = true;

      const email = document.getElementById('email').value.trim();
      const password = pwdInput.value;

      if (!email || !password) { showError('Please fill in all fields'); return; }

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (!res.ok) { showError(data.message || 'Invalid credentials. Please try again.'); return; }

        localStorage.setItem('adminToken', data.token);
        localStorage.setItem('adminUser', JSON.stringify(data.admin));
        window.location.href = './dashboard.html';
      } catch (err) {
        showError('Unable to connect. Please check your internet and try again.');
      }
    });

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = 'block';
      spinner.style.display = 'none';
      loginBtn.disabled = false;
    }

    if (localStorage.getItem('adminToken')) {
      fetch('/api/auth/verify', { headers: { 'Authorization': 'Bearer ' + localStorage.getItem('adminToken') } })
        .then(r => { if (r.ok) window.location.href = './dashboard.html'; else { localStorage.removeItem('adminToken'); localStorage.removeItem('adminUser'); } })
        .catch(() => {});
    }
  </script>
</body>
</html>
