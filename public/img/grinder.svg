<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Angle grinder power tool">
  <defs>
    <linearGradient id="gShell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39434f"/><stop offset=".42" stop-color="#1c232b"/><stop offset="1" stop-color="#0a0e12"/>
    </linearGradient>
    <linearGradient id="gOrange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffa94d"/><stop offset=".45" stop-color="#ef7d15"/><stop offset="1" stop-color="#a44f06"/>
    </linearGradient>
    <linearGradient id="gHead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7fa"/><stop offset=".32" stop-color="#b6bfca"/>
      <stop offset=".68" stop-color="#69737f"/><stop offset="1" stop-color="#39424d"/>
    </linearGradient>
    <linearGradient id="gDisc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b636d"/><stop offset=".5" stop-color="#2d343c"/><stop offset="1" stop-color="#4a525c"/>
    </linearGradient>
    <radialGradient id="gGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f4801f" stop-opacity=".22"/><stop offset="1" stop-color="#f4801f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gShadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#000" stop-opacity=".5"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="400" cy="300" r="300" fill="url(#gGlow)"/>
  <ellipse cx="400" cy="506" rx="260" ry="38" fill="url(#gShadow)"/>

  <g transform="rotate(-12 400 300)">
    <!-- power cord -->
    <path d="M108 336 C56 336 40 380 62 414" fill="none" stroke="#0a0e12" stroke-width="26" stroke-linecap="round"/>
    <rect x="96" y="292" width="46" height="88" rx="16" fill="#12181f"/>

    <!-- motor barrel -->
    <rect x="130" y="278" width="290" height="116" rx="58" fill="url(#gShell)"/>
    <rect x="130" y="278" width="290" height="44" rx="22" fill="#fff" opacity=".06"/>
    <!-- vents -->
    <g stroke="#000" stroke-opacity=".55" stroke-width="7" stroke-linecap="round">
      <path d="M186 306 v60"/><path d="M208 300 v72"/><path d="M230 298 v76"/><path d="M252 300 v72"/><path d="M274 306 v60"/>
    </g>
    <!-- brand collar -->
    <rect x="300" y="278" width="70" height="116" fill="url(#gOrange)"/>
    <path d="M300 278 h70 v44 h-70 z" fill="#fff" opacity=".14"/>
    <text x="335" y="348" font-family="Inter,sans-serif" font-size="19" font-weight="900"
          fill="#2a1403" letter-spacing="1.5" text-anchor="middle">AUM</text>

    <!-- paddle switch -->
    <rect x="150" y="392" width="150" height="26" rx="13" fill="#161d25"/>
    <rect x="156" y="396" width="120" height="16" rx="8" fill="#39434f"/>

    <!-- side handle -->
    <g transform="rotate(-34 430 268)">
      <rect x="404" y="176" width="46" height="104" rx="22" fill="url(#gShell)"/>
      <rect x="404" y="176" width="46" height="38" rx="19" fill="#fff" opacity=".07"/>
      <rect x="410" y="266" width="34" height="26" rx="10" fill="#69737f"/>
    </g>

    <!-- gear head -->
    <path d="M404 268 h96 a58 58 0 0 1 58 58 v22 a58 58 0 0 1 -58 58 h-96 z" fill="url(#gHead)"/>
    <path d="M404 268 h96 a58 58 0 0 1 58 58 h-154 z" fill="#fff" opacity=".22"/>
    <g fill="#4c5561">
      <circle cx="470" cy="292" r="7"/><circle cx="540" cy="316" r="7"/>
      <circle cx="540" cy="368" r="7"/><circle cx="470" cy="392" r="7"/>
    </g>

    <!-- guard -->
    <path d="M556 250 a112 112 0 0 1 0 188 l0 -36 a76 76 0 0 0 0 -116 z" fill="#1b222a"/>
    <path d="M556 250 a112 112 0 0 1 44 42 l-32 18 a76 76 0 0 0 -12 -24 z" fill="#39434f"/>

    <!-- cutting disc -->
    <circle cx="590" cy="344" r="128" fill="url(#gDisc)"/>
    <circle cx="590" cy="344" r="128" fill="none" stroke="#7e8894" stroke-width="2" opacity=".5"/>
    <circle cx="590" cy="344" r="104" fill="none" stroke="#0f141a" stroke-width="2" opacity=".6"/>
    <circle cx="590" cy="344" r="46" fill="#e8edf3"/>
    <circle cx="590" cy="344" r="46" fill="none" stroke="#98a3af" stroke-width="2"/>
    <circle cx="590" cy="344" r="16" fill="#0d1218"/>
    <text x="590" y="316" font-family="Inter,sans-serif" font-size="14" font-weight="800"
          fill="#5d6773" letter-spacing="1" text-anchor="middle">4″</text>

    <!-- sparks -->
    <g stroke="#ffb347" stroke-width="2.5" stroke-linecap="round" opacity=".9">
      <path d="M688 420 l44 30"/><path d="M700 396 l52 14"/><path d="M668 444 l30 40"/>
    </g>
    <g fill="#ffd08a">
      <circle cx="742" cy="456" r="3"/><circle cx="762" cy="414" r="2.5"/><circle cx="706" cy="492" r="2.5"/>
      <circle cx="722" cy="376" r="2"/>
    </g>
  </g>
</svg>
