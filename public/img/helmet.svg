<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Auto-darkening welding helmet">
  <defs>
    <linearGradient id="hShell" x1=".15" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#3f6ea8"/><stop offset=".38" stop-color="#1f4675"/><stop offset="1" stop-color="#0e2340"/>
    </linearGradient>
    <linearGradient id="hShellEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fb4e8" stop-opacity=".9"/><stop offset=".5" stop-color="#7fb4e8" stop-opacity="0"/><stop offset="1" stop-color="#7fb4e8" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="hLensFrame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f5f9"/><stop offset=".5" stop-color="#9fa9b6"/><stop offset="1" stop-color="#5b6470"/>
    </linearGradient>
    <linearGradient id="hLens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12313f"/><stop offset=".45" stop-color="#071a24"/><stop offset="1" stop-color="#0d2b38"/>
    </linearGradient>
    <linearGradient id="hOrange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9d3f"/><stop offset="1" stop-color="#e0710f"/>
    </linearGradient>
    <radialGradient id="hGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2a6fb5" stop-opacity=".45"/><stop offset="1" stop-color="#2a6fb5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hShadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#000" stop-opacity=".5"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <circle cx="400" cy="300" r="290" fill="url(#hGlow)"/>
  <ellipse cx="400" cy="536" rx="200" ry="34" fill="url(#hShadow)"/>

  <!-- outer shell -->
  <path d="M400 74
           c108 0 176 46 190 128
           c9 52 6 122 -6 176
           c-14 62 -46 118 -86 142
           c-28 17 -68 22 -98 22
           s-70 -5 -98 -22
           c-40 -24 -72 -80 -86 -142
           c-12 -54 -15 -124 -6 -176
           C224 120 292 74 400 74 Z"
        fill="url(#hShell)"/>
  <path d="M400 74
           c108 0 176 46 190 128
           c9 52 6 122 -6 176
           c-14 62 -46 118 -86 142
           c-28 17 -68 22 -98 22
           s-70 -5 -98 -22
           c-40 -24 -72 -80 -86 -142
           c-12 -54 -15 -124 -6 -176
           C224 120 292 74 400 74 Z"
        fill="none" stroke="url(#hShellEdge)" stroke-width="3"/>

  <!-- crown sheen -->
  <path d="M400 92 c92 0 152 38 168 104 c-52 -46 -104 -66 -168 -66 s-116 20 -168 66 C248 130 308 92 400 92 Z"
        fill="url(#hSheen)"/>

  <!-- brand flame stripe -->
  <path d="M400 110 c22 34 34 58 34 82 c0 26 -16 42 -34 42 s-34 -16 -34 -42 c0 -24 12 -48 34 -82 Z"
        fill="url(#hOrange)" opacity=".92"/>
  <path d="M400 146 c11 19 17 32 17 45 c0 14 -8 23 -17 23 s-17 -9 -17 -23 c0 -13 6 -26 17 -45 Z"
        fill="#7fdcff" opacity=".85"/>

  <!-- lens surround -->
  <rect x="222" y="252" width="356" height="132" rx="20" fill="url(#hLensFrame)"/>
  <rect x="234" y="264" width="332" height="108" rx="13" fill="#151b22"/>
  <rect x="246" y="276" width="308" height="84" rx="8" fill="url(#hLens)"/>
  <path d="M258 352 L318 284 L344 284 L284 352 Z" fill="#dfe9f2" opacity=".16"/>
  <path d="M300 352 L360 284 L374 284 L314 352 Z" fill="#dfe9f2" opacity=".1"/>
  <rect x="246" y="276" width="308" height="84" rx="8" fill="none" stroke="#4aa8e8" stroke-width="1.5" opacity=".35"/>

  <!-- sensors -->
  <g fill="#0b1016">
    <rect x="252" y="230" width="30" height="12" rx="6"/>
    <rect x="518" y="230" width="30" height="12" rx="6"/>
  </g>
  <circle cx="267" cy="236" r="3" fill="#3ddc84" opacity=".9"/>
  <circle cx="533" cy="236" r="3" fill="#3ddc84" opacity=".9"/>

  <!-- chin vents -->
  <g stroke="#0a1220" stroke-opacity=".7" stroke-width="7" stroke-linecap="round">
    <path d="M352 434 h96"/><path d="M340 458 h120"/><path d="M356 482 h88"/>
  </g>

  <!-- shade label -->
  <text x="400" y="416" font-family="Inter,sans-serif" font-size="15" font-weight="700"
        fill="#9dc4ea" letter-spacing="4" text-anchor="middle" opacity=".8">SHADE 9–13</text>
</svg>
